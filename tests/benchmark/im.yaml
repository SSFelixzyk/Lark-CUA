# IM (即时通讯) 测试集
# 运行前请将 <<TEST_CONTACT>> 替换为你飞书账号中真实存在的联系人名称
# 运行前请将 <<TEST_GROUP>> 替换为真实存在的群聊名称（如 CUA-Lark课题-6）

cases:

  # ── L1 单步 ──────────────────────────────────────────────────────────────

  - id: IM_L1_001
    level: L1
    title: 导航到消息页面
    task: "点击飞书左侧导航栏中的「消息」图标，进入 IM 消息页面。"
    ui_hints: "「消息」图标在左侧导航栏最顶部，图标为对话气泡形状。点击后右侧会显示会话列表。"
    preconditions:
      - 飞书桌面客户端已登录并处于前台
    success_criteria: "飞书主界面左侧「消息」图标高亮，右侧显示会话列表"
    checkpoints:
      - "左侧导航栏「消息」图标呈选中/高亮状态"
      - "右侧主区域显示会话列表（包含群聊或单聊条目）"
    expected_steps: 1
    timeout_steps: 5
    tags: [navigation, smoke]

  - id: IM_L1_002
    level: L1
    title: 使用快捷键打开全局搜索
    task: "使用 Ctrl+K 打开飞书全局搜索框。"
    ui_hints: "按 Ctrl+K 可直接弹出全局搜索框。若无响应，也可点击会话列表顶部显示「搜索 Ctrl+K」的搜索输入框。"
    preconditions:
      - 飞书桌面客户端已登录并处于前台
    success_criteria: "全局搜索框弹出并处于输入焦点状态"
    checkpoints:
      - "屏幕中央或顶部出现搜索输入框"
      - "搜索框内有光标或占位提示文字"
    expected_steps: 1
    timeout_steps: 5
    tags: [navigation, shortcut, smoke]

  # ── L2 多步单产品 ─────────────────────────────────────────────────────────

  - id: IM_L2_001
    level: L2
    title: 搜索联系人并发送文本消息
    task: >
      在飞书 IM 中，使用 Ctrl+K 全局搜索联系人「<<TEST_CONTACT>>」，
      进入与该联系人的单聊界面，
      在消息输入框输入「【自动化测试】CUA-Lark Agent 单聊消息测试」，
      然后按回车发送。
    ui_hints: >
      Ctrl+K 打开全局搜索后，直接输入联系人姓名，在结果列表中点击该联系人即可进入单聊。
      消息输入框位于聊天窗口底部，点击后直接输入文字，按 Enter 发送（Shift+Enter 换行）。
      若 Ctrl+K 无响应，可点击会话列表顶部的搜索框替代。
    preconditions:
      - 飞书已登录
      - 联系人「<<TEST_CONTACT>>」已在好友列表中
    success_criteria: "聊天记录最底部出现发送内容的消息气泡"
    checkpoints:
      - "搜索结果中出现联系人「<<TEST_CONTACT>>」"
      - "进入与该联系人的单聊界面，顶部显示联系人名称"
      - "消息气泡出现在聊天记录底部，内容包含「CUA-Lark Agent」"
    expected_steps: 5
    timeout_steps: 12
    tags: [im, send_message, core]

  - id: IM_L2_002
    level: L2
    title: 在群聊中发送消息并 @ 成员
    task: >
      进入飞书群聊「<<TEST_GROUP>>」，
      在消息输入框输入「@」后选择群内第一个成员，
      然后继续输入「【自动化测试】@提及功能验证」，
      按回车发送。
    ui_hints: >
      在会话列表中搜索或直接找到群聊「<<TEST_GROUP>>」后点击进入。
      消息输入框内输入「@」后会弹出成员选择浮层，用鼠标点击或方向键选择第一个成员后按 Enter 确认。
      也可点击输入栏左侧的「@」图标代替手动输入「@」。
      @ 成员后继续在同一输入框输入后续文字，最后按 Enter 发送。
    preconditions:
      - 飞书已登录
      - 群聊「<<TEST_GROUP>>」中有至少 2 名成员
    success_criteria: "消息气泡出现，包含 @ 提及和测试文本"
    checkpoints:
      - "进入群聊「<<TEST_GROUP>>」界面"
      - "输入 @ 后出现成员选择下拉列表"
      - "发送后消息气泡底部包含蓝色 @ 提及文字"
    expected_steps: 7
    timeout_steps: 15
    tags: [im, mention, group]

  - id: IM_L2_003
    level: L2
    title: 创建新群聊并设置群名
    task: >
      在飞书 IM 页面，点击会话列表右上角的新建图标，
      选择「创建群组」，
      添加成员「<<TEST_CONTACT>>」，
      将群名称设置为「CUA-Lark 自动化测试群」，
      完成创建。
    ui_hints: >
      「消息」面板顶部 header 右上角有一个「+」新建按钮（不是搜索框旁边），点击后弹出菜单，选择「创建群组」。
      在创建群组弹窗中：先在成员搜索框输入「<<TEST_CONTACT>>」找到并勾选，
      然后在群名称输入框清空默认内容并输入「CUA-Lark 自动化测试群」，最后点击「创建」按钮。
    preconditions:
      - 飞书已登录
      - 联系人「<<TEST_CONTACT>>」已在好友列表中
    success_criteria: "新群聊创建成功，群名为「CUA-Lark 自动化测试群」"
    checkpoints:
      - "出现创建群组的对话框或页面"
      - "成员搜索结果中找到「<<TEST_CONTACT>>」并已添加"
      - "群名输入框中显示「CUA-Lark 自动化测试群」"
      - "创建成功后进入群聊界面，顶部显示群名"
    expected_steps: 8
    timeout_steps: 18
    tags: [im, create_group, core]

  - id: IM_L2_004
    level: L2
    title: 转发消息到另一个会话
    task: >
      进入飞书群聊「<<TEST_GROUP>>」，
      右键点击最新一条消息，
      选择「转发」，
      将消息转发到与「<<TEST_CONTACT>>」的单聊。
    ui_hints: >
      进入群聊后，将鼠标悬停在消息气泡上，气泡右侧会出现操作图标，点击「转发」箭头图标；
      也可右键点击消息气泡，在右键菜单中选择「转发」。
      转发目标选择界面中搜索「<<TEST_CONTACT>>」并点击确认发送。
    preconditions:
      - 飞书已登录
      - 群聊「<<TEST_GROUP>>」中有至少一条消息
      - 联系人「<<TEST_CONTACT>>」已在好友列表中
    success_criteria: "消息成功转发，目标会话底部出现转发消息气泡"
    checkpoints:
      - "右键菜单中出现「转发」选项"
      - "转发目标选择界面出现"
      - "在目标单聊中出现带「转发」标记的消息气泡"
    expected_steps: 8
    timeout_steps: 18
    tags: [im, forward, core]

  - id: IM_L2_005
    level: L2
    title: 发送图片消息
    task: >
      进入飞书群聊「<<TEST_GROUP>>」，
      点击消息输入框左侧的「更多」图标，
      选择「图片/视频」，
      上传本地任意一张图片，
      发送图片消息。
    ui_hints: >
      消息输入栏左侧有「更多」图标（⋯ 或 + 符号），点击后展开菜单，选择「图片/视频」打开文件选择对话框。
      选择本地图片后，输入区会显示图片预览，此时点击「发送」按钮或按 Enter 发送。
      也可直接将图片文件拖拽到输入框，或使用剪贴板粘贴（Ctrl+V）发送截图。
    preconditions:
      - 飞书已登录
      - 本地存在可上传的图片文件
    success_criteria: "图片消息气泡出现在群聊记录底部"
    checkpoints:
      - "出现文件选择对话框"
      - "选择图片后消息输入区域显示图片预览"
      - "发送后群聊底部出现图片消息气泡"
    expected_steps: 6
    timeout_steps: 15
    tags: [im, media, attachment]

  - id: IM_L2_006
    level: L2
    title: 在会话内搜索消息记录
    task: >
      进入飞书群聊「<<TEST_GROUP>>」，
      点击聊天窗口右上角搜索（放大镜）图标，
      在搜索框输入关键词「自动化」，
      在搜索结果中打开任意一条匹配记录，确认可定位到聊天上下文。
    ui_hints: >
      聊天窗口右上角工具栏最左侧是放大镜（搜索）图标，点击后展开会话内搜索面板。
      搜索范围仅限当前会话的历史消息，与全局搜索（Ctrl+K）不同。
      点击搜索结果后，聊天区域会滚动定位到该消息。
    preconditions:
      - 飞书已登录
      - 群聊「<<TEST_GROUP>>」中存在包含「自动化」的历史消息
    success_criteria: "搜索界面显示匹配结果，并可跳转到对应聊天位置"
    checkpoints:
      - "出现会话内搜索或聊天记录面板"
      - "搜索结果列表中出现含「自动化」的条目"
      - "点击结果后聊天区域滚动到对应消息附近"
    expected_steps: 7
    timeout_steps: 16
    tags: [im, search_history, core]

  - id: IM_L2_007
    level: L2
    title: 对消息添加表情回复
    task: >
      进入飞书群聊「<<TEST_GROUP>>」，
      将鼠标悬停在任意一条他人发送的消息气泡上，
      点击出现的「表情」图标，选择任意一个表情（如点赞），
      确认该消息下方出现表情回应。
    ui_hints: >
      将鼠标移到消息气泡上，气泡右侧会出现一排操作图标，最左侧是笑脸「表情」图标，点击后展开 emoji 选择面板。
      选择表情后，该表情会显示在消息气泡下方，并显示回应人数。
    preconditions:
      - 飞书已登录
      - 群聊「<<TEST_GROUP>>」中至少有一条非本人发送的消息
    success_criteria: "目标消息旁或下方显示已添加的表情回应"
    checkpoints:
      - "悬停消息后显示表情/更多操作入口"
      - "点击表情后界面有反馈（表情计数或高亮）"
      - "消息气泡附近可见所选表情图标"
    expected_steps: 5
    timeout_steps: 14
    tags: [im, reaction, emoji]

  # ── L3 跨产品联动 ─────────────────────────────────────────────────────────

  - id: IM_L3_001
    level: L3
    title: 通过 IM 分享云文档链接
    task: >
      先进入飞书云文档页面，新建一个空白文档并命名为「共享测试文档」，
      复制该文档的分享链接，
      然后返回 IM，进入与「<<TEST_CONTACT>>」的单聊，
      将链接粘贴到消息框并发送。
    ui_hints: >
      左侧导航点击「云文档」进入文档页，新建文档后在顶部或右上角点击「分享」按钮复制链接。
      返回 IM 可点击左侧导航「消息」图标，用 Ctrl+K 搜索「<<TEST_CONTACT>>」进入单聊。
      在消息输入框按 Ctrl+V 粘贴链接后按 Enter 发送。
    preconditions:
      - 飞书已登录
      - 联系人「<<TEST_CONTACT>>」已在好友列表中
      - 有云文档访问权限
    success_criteria: "单聊底部出现包含云文档链接的消息，链接可预览"
    checkpoints:
      - "成功创建名为「共享测试文档」的云文档"
      - "分享链接已复制到剪贴板（可通过粘贴验证）"
      - "单聊消息气泡中包含飞书文档链接卡片"
    expected_steps: 12
    timeout_steps: 25
    tags: [im, docs, cross_product, L3]

  - id: IM_L3_002
    level: L3
    title: 通过 IM 分享日程邀请
    task: >
      先进入飞书日历，创建一个明天上午 10 点的日程，
      标题为「CUA-Lark 自动化测试会议」，
      复制日程链接或发起邀请，
      然后切换到 IM，在群聊「<<TEST_GROUP>>」中发送该日程邀请。
    ui_hints: >
      左侧导航点击「日历」进入，点击明天的时间格或「新建日程」创建日程并填写标题和时间。
      日程详情页可找到「复制链接」或「邀请成员」选项。
      返回 IM 后在群聊输入框粘贴并发送。
    preconditions:
      - 飞书已登录
      - 有日历写权限
    success_criteria: "群聊底部出现日程卡片消息"
    checkpoints:
      - "日历中成功创建标题为「CUA-Lark 自动化测试会议」的日程"
      - "群聊底部出现日程卡片，显示会议标题和时间"
    expected_steps: 14
    timeout_steps: 30
    tags: [im, calendar, cross_product, L3]
